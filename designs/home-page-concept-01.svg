<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="180" y1="96" x2="1250" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9FBFE"/>
      <stop offset="1" stop-color="#EEF3F9"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 180) rotate(19) scale(420 300)">
      <stop stop-color="#D8E6FB"/>
      <stop offset="1" stop-color="#D8E6FB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 180) rotate(160) scale(360 260)">
      <stop stop-color="#E8F0FB"/>
      <stop offset="1" stop-color="#E8F0FB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="button" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3E7AF2"/>
      <stop offset="1" stop-color="#245FD8"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1440" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="softBlur" x="640" y="100" width="720" height="860" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1440" height="1024" fill="url(#bg)"/>
  <ellipse cx="250" cy="180" rx="420" ry="300" fill="url(#glowA)"/>
  <ellipse cx="1120" cy="180" rx="360" ry="260" fill="url(#glowB)"/>

  <g filter="url(#shadow)">
    <rect x="74" y="66" width="1292" height="892" rx="36" fill="white" fill-opacity="0.76"/>
  </g>

  <rect x="118" y="120" width="222" height="54" rx="6" fill="white" fill-opacity="0.01"/>
  <text x="122" y="166" fill="#24385B" font-family="Montserrat, Inter, Arial, sans-serif" font-size="54" font-weight="600" letter-spacing="-1.2">AJIX</text>
  <text x="362" y="166" fill="#3E4E69" font-family="Montserrat, Inter, Arial, sans-serif" font-size="54" font-weight="300" letter-spacing="2.8">PHARMACY</text>
  <path d="M84 145C106 120 130 104 147 92C180 117 193 149 185 190C162 169 137 151 94 148L84 145Z" fill="#4B93E5"/>
  <path d="M137 157C148 143 161 133 177 124" stroke="white" stroke-width="13" stroke-linecap="round"/>

  <text x="120" y="340" fill="#213556" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="400" letter-spacing="-2.4">
    <tspan x="120" dy="0">Pharmacy Practice</tspan>
    <tspan x="120" dy="92">&amp; Assessment Portal</tspan>
  </text>

  <text x="122" y="560" fill="#677488" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" letter-spacing="0">
    <tspan x="122" dy="0">A structured training environment for realistic pharmacy</tspan>
    <tspan x="122" dy="48">practice, timed assessments, and clear performance review.</tspan>
  </text>

  <rect x="122" y="655" width="236" height="74" rx="12" fill="url(#button)"/>
  <text x="240" y="702" text-anchor="middle" fill="white" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600">Enter Portal</text>

  <text x="122" y="812" fill="#6E7B8D" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400">For support</text>
  <text x="122" y="865" fill="#405167" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400">✉ ajixpharmacy@gmail.com</text>
  <text x="122" y="913" fill="#405167" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400">✆ +233595597218</text>

  <g filter="url(#softBlur)" opacity="0.35">
    <rect x="792" y="238" width="460" height="546" rx="120" fill="#DDE8F5"/>
  </g>

  <g opacity="0.96">
    <image href="../images/pharmacist-hero.png.png" x="710" y="132" width="650" height="770" preserveAspectRatio="xMidYMid meet"/>
    <rect x="648" y="112" width="730" height="820" fill="url(#bg)" fill-opacity="0.01"/>
    <ellipse cx="1030" cy="534" rx="340" ry="392" fill="white" fill-opacity="0.01"/>
  </g>

  <rect x="720" y="124" width="628" height="784" rx="180" stroke="#EDF3FA" stroke-width="2" stroke-opacity="0.7"/>
