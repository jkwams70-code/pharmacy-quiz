<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f3f7f" />
    <title>Ajix Pharmacy Quiz</title>
    <meta http-equiv="refresh" content="0;url=/" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0f172a;
        color: #f8fafc;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      .launch-card {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        border-radius: 16px;
        background: #162133;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
      }

      .launch-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #60a5fa;
        animation: pulse 1.1s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
          transform: scale(0.92);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="launch-card" aria-live="polite">
      <span class="launch-dot" aria-hidden="true"></span>
      <span>Opening Ajix Pharmacy Quiz...</span>
    </div>
    <script>
      (function () {
        var nextUrl = "/?cb=" + Date.now();
        try {
          if (window.location.search) {
            nextUrl = "/" + window.location.search + "&cb=" + Date.now();
          }
          if (window.location.hash) {
            nextUrl += window.location.hash;
          }
        } catch (error) {
          console.warn("PWA launch URL build failed:", error);
        }

        window.setTimeout(function () {
          window.location.replace(nextUrl);
        }, 100);
      })();
    </script>
  </body>
</html>
